<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="https://i.postimg.cc/XvYJFGrX/muhammed-yasser-seo-specialist.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>الصفحة غير موجودة | محمد ياسر</title>
    <style>
      :root {
        --ink: #0f172a; --panel: #101c33; --line: #23344f; --linesoft: rgba(148, 163, 184, 0.12);
        --paper: #e2e8f0; --muted: #94a3b8; --dim: #5f6f88;
        --accent: #3b82f6; --cyan: #06b6d4;
        --grad: linear-gradient(135deg, #3b82f6, #06b6d4);
        --disp: "Alexandria", "IBM Plex Sans Arabic", sans-serif;
        --body: "IBM Plex Sans Arabic", "Alexandria", sans-serif;
        --grot: "Space Grotesk", "Alexandria", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body { background: var(--ink); color: var(--paper); font-family: var(--body); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; overflow-x: hidden; -webkit-font-smoothing: antialiased; position: relative; }
      body::before, body::after { content: ""; position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; }
      body::before { width: 480px; height: 480px; background: rgba(59, 130, 246, 0.08); top: -160px; inset-inline-start: -160px; }
      body::after { width: 380px; height: 380px; background: rgba(6, 182, 212, 0.06); bottom: -120px; inset-inline-end: -120px; }
      .pill { display: inline-flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 50px; padding: 11px 22px; margin-bottom: 30px; direction: ltr; }
      .pill .q { font-family: var(--grot); font-size: 0.85rem; color: var(--muted); }
      .pill .caret { width: 2px; height: 16px; background: var(--accent); animation: blink 1s step-end infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .pill svg { color: var(--accent); flex-shrink: 0; }
      h1 { font-size: clamp(5rem, 20vw, 8.5rem); font-weight: 900; font-family: var(--grot); background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1.05; }
      h2 { font-family: var(--disp); font-weight: 800; font-size: clamp(1.4rem, 4vw, 2rem); margin-top: 16px; }
      p { color: var(--muted); font-size: 0.92rem; line-height: 2; margin: 16px auto 34px; max-width: 480px; text-align: center; }
      p b { color: var(--paper); font-weight: 600; }
      .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
      .btn { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.88rem; height: 50px; padding-inline: 26px; transition: 0.3s; border: 1px solid transparent; }
      .btn-grad { background: var(--grad); color: #fff; }
      .btn-grad:hover { transform: translateY(-2px); box-shadow: 0 12px 34px -10px rgba(59, 130, 246, 0.55); }
      .btn-ghost { border-color: var(--line); color: var(--paper); }
      .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
      .hint { margin-top: 46px; font-family: var(--grot); font-size: 0.6rem; letter-spacing: 0.25em; color: var(--dim); text-transform: uppercase; direction: ltr; }
    </style>
  </head>
  <body>
    <div class="pill">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span class="q">الصفحة دي مش مفهرسة</span>
      <span class="caret"></span>
    </div>

    <h1>404</h1>
    <h2>الصفحة اللي بتدوّر عليها مش موجودة</h2>
    <p>يمكن اللينك اتغيّر أو اتكتب غلط — بس متقلقش، <b>حتى جوجل بيرجّع 404 أحيانًا.</b> المهم الـ Redirect الصح.</p>

    <div class="row">
      <a class="btn btn-grad" href="https://muhammedyasserbs.github.io">ارجع للرئيسية ←</a>
      <a class="btn btn-ghost" href="case-studies.html">شوف الكيس استادي</a>
    </div>

    <span class="hint">ERROR · PAGE NOT INDEXED · MUHAMMED YASSER SEO</span>
  </body>
</html>
